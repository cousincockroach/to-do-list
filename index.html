<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    
    <!-- 🌟 Font Awesome CDN link required for fa-solid icons -->
    <link 
      rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
    />
<script defer src="main.js"></script></head>
<body>
    <header class="header">
        <h1>To Do List</h1>
    </header>
    <div class="container">
    <div class="sidebar">
         <button class="inbox"><i class="fa-solid fa-envelope"></i> Inbox</button>
        <button class="today"><i class="fa-solid fa-calendar"></i> Today</button>
        <button class="upcoming"><i class="fa-regular fa-calendar"></i> Upcoming</button>
    </div>
    <div class="content">
        <h2>Inbox</h2>
        <button class="add-btn">+ Add Task</button>
    </div>
    <div
    </div>
</body>
</html>
